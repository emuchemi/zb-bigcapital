# Zahir and Batin — Nginx Configuration for BigCapital Homelab
# ============================================================
# This file configures Nginx as the front door for the application.
#
# How traffic flows:
#   Browser → Nginx (port 80) → BigCapital webapp (React UI)
#                             → BigCapital server (API, /api/*)
#
# To add SSL later, see the commented SSL section at the bottom.
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log format — includes real client IP (important when behind Cloudflare Tunnel)
    log_format main '$http_x_forwarded_for - $remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;

    # ── Upload size limit ──────────────────────────────────
    # Allows receipt photos up to 20MB.
    # Increase if you need to upload larger documents.
    client_max_body_size 20M;

    # ── Gzip compression ───────────────────────────────────
    # Makes the app load faster by compressing responses.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Upstream services ──────────────────────────────────
    # These names match the service names in docker-compose.homelab.yml.
    upstream bigcapital_server {
        server server:3000;
        keepalive 32;
    }

    upstream bigcapital_webapp {
        server webapp:80;
        keepalive 32;
    }

    # ── Main server block (HTTP) ───────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Trust Cloudflare real IP headers ──────────────
        # When accessed via Cloudflare Tunnel, the real client IP
        # is passed in X-Forwarded-For. This tells Nginx to trust it.
        # Cloudflare IPv4 ranges (https://www.cloudflare.com/ips/):
        set_real_ip_from 103.21.244.0/22;
        set_real_ip_from 103.22.200.0/22;
        set_real_ip_from 103.31.4.0/22;
        set_real_ip_from 104.16.0.0/13;
        set_real_ip_from 104.24.0.0/14;
        set_real_ip_from 108.162.192.0/18;
        set_real_ip_from 131.0.72.0/22;
        set_real_ip_from 141.101.64.0/18;
        set_real_ip_from 162.158.0.0/15;
        set_real_ip_from 172.64.0.0/13;
        set_real_ip_from 173.245.48.0/20;
        set_real_ip_from 188.114.96.0/20;
        set_real_ip_from 190.93.240.0/20;
        set_real_ip_from 197.234.240.0/22;
        set_real_ip_from 198.41.128.0/17;
        # Cloudflare IPv6 ranges:
        set_real_ip_from 2400:cb00::/32;
        set_real_ip_from 2606:4700::/32;
        set_real_ip_from 2803:f800::/32;
        set_real_ip_from 2405:b500::/32;
        set_real_ip_from 2405:8100::/32;
        set_real_ip_from 2a06:98c0::/29;
        set_real_ip_from 2c0f:f248::/32;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # ── Security headers ───────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API routes → BigCapital server ─────────────────
        # All requests starting with /api/ go to the NestJS backend.
        location /api/ {
            proxy_pass http://bigcapital_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Increase timeout for long-running operations (PDF generation, imports)
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
        }

        # ── Public document routes (Gotenberg PDF access) ──
        location /public/ {
            proxy_pass http://bigcapital_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # ── Swagger API documentation ──────────────────────
        # Available at http://<your-server>/swagger
        # Useful for the accountant or future integrations.
        location /swagger {
            proxy_pass http://bigcapital_server;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── All other routes → BigCapital webapp ───────────
        # The React app handles its own routing (React Router).
        # Any URL not matched above goes to the webapp container.
        # The webapp container's own server handles SPA routing internally
        # (returns index.html for unknown routes) — no special handling needed here.
        location / {
            proxy_pass http://bigcapital_webapp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
        }
    }

    # ══════════════════════════════════════════════════════
    # SSL/HTTPS — UNCOMMENT WHEN READY TO ADD CERTIFICATES
    # ══════════════════════════════════════════════════════
    # If you are using Cloudflare Tunnel, you do NOT need to
    # configure SSL here — Cloudflare handles it for you.
    #
    # Only configure SSL below if you are running without
    # Cloudflare and want a local certificate (e.g. from
    # Let's Encrypt via Certbot or a self-signed cert).
    #
    # server {
    #     listen 443 ssl;
    #     server_name your.domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     # ... (same location blocks as above)
    # }
    #
    # server {
    #     listen 80;
    #     server_name your.domain.com;
    #     return 301 https://$host$request_uri;
    # }
}
