# Zahir and Batin — BigCapital Homelab Deployment
# ============================================================
# Use this file to run BigCapital on your Proxmox homelab.
#
# Prerequisites:
#   - Docker and Docker Compose installed on your Proxmox LXC
#   - A .env file created from .env.homelab.example
#   - Ports 80 (and optionally 443) available on the host
#
# Start:  docker compose -f docker-compose.homelab.yml --env-file .env up -d
# Stop:   docker compose -f docker-compose.homelab.yml down
# Logs:   docker compose -f docker-compose.homelab.yml logs -f
# ============================================================

# version field removed — obsolete in Docker Compose v2+

services:

  # ── Nginx reverse proxy ────────────────────────────────────
  # Routes browser traffic to the right service.
  # Replaces the upstream Envoy proxy (which is complex to configure).
  # /api/*  → BigCapital server (API)
  # /*      → BigCapital webapp (browser interface)
  nginx:
    container_name: zb-nginx
    image: nginx:1.27-alpine
    depends_on:
      - server
      - webapp
    ports:
      - '${PUBLIC_PORT:-80}:80'
      # SSL port — uncomment when you add a TLS certificate
      # - '${PUBLIC_SSL_PORT:-443}:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Uncomment to add SSL certificates (e.g. from Cloudflare or Let's Encrypt)
      # - ./docker/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped
    networks:
      - zb_network
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost/ || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3

  # ── BigCapital web interface ───────────────────────────────
  # Built from source so Z&B customisations are included.
  # First build takes 5-10 minutes. Subsequent builds use Docker cache.
  webapp:
    container_name: zb-webapp
    build:
      context: ./
      dockerfile: packages/webapp/Dockerfile
    image: zb-bigcapital-webapp
    restart: unless-stopped
    networks:
      - zb_network

  # ── BigCapital API server ──────────────────────────────────
  # Built from source so Z&B modules, migrations, and seed data are included.
  # The image is tagged zb-bigcapital-server so the migration container can reuse it.
  server:
    container_name: zb-server
    build:
      context: ./
      dockerfile: packages/server/Dockerfile
    image: zb-bigcapital-server
    expose:
      - '3000'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio_setup:
        condition: service_completed_successfully
      database_migration:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - zb_network
    environment:
      # ── Mail (optional — used for password reset and notifications) ──
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_SECURE=${MAIL_SECURE:-false}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Zahir and Batin}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}

      # ── Database ──────────────────────────────────────────
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}

      # ── System database (stores tenants/organisations) ────
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}

      # ── Redis (cache and background jobs) ─────────────────
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_HOST=redis
      - QUEUE_PORT=6379

      # ── Tenant databases ───────────────────────────────────
      # Each company (tenant) gets its own database.
      # The prefix is prepended to the tenant's database name.
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}

      # ── Authentication ─────────────────────────────────────
      - JWT_SECRET=${JWT_SECRET}

      # ── Application URL ────────────────────────────────────
      # The URL where this app is accessed (local or via Cloudflare Tunnel)
      - BASE_URL=${BASE_URL}

      # ── Sign-up restrictions ───────────────────────────────
      # Disable open sign-up — only invited users should join.
      - SIGNUP_DISABLED=${SIGNUP_DISABLED:-true}
      - SIGNUP_ALLOWED_EMAILS=${SIGNUP_ALLOWED_EMAILS}
      - SIGNUP_ALLOWED_DOMAINS=${SIGNUP_ALLOWED_DOMAINS}
      - SIGNUP_EMAIL_CONFIRMATION=${SIGNUP_EMAIL_CONFIRMATION:-false}

      # ── PDF generation (Gotenberg) ─────────────────────────
      - GOTENBERG_URL=http://gotenberg:3000
      - GOTENBERG_DOCS_URL=http://server:3000/public/

      # ── Exchange rates ─────────────────────────────────────
      # Uses Open Exchange Rates for live TZS/USD/EUR/GBP rates.
      # Get a free App ID from: https://openexchangerates.org/signup/free
      - EXCHANGE_RATE_SERVICE=${EXCHANGE_RATE_SERVICE:-open-exchange-rate}
      - OPEN_EXCHANGE_RATE_APP_ID=${OPEN_EXCHANGE_RATE_APP_ID}

      # ── File storage (MinIO — local S3-compatible) ─────────
      # MinIO runs locally in this Docker Compose stack.
      # No AWS account needed.
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - S3_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${MINIO_BUCKET:-zb-attachments}

      # ── Disabled cloud services ────────────────────────────
      # These are BigCapital cloud features not used in this homelab setup.
      - BANK_FEED_ENABLED=false
      - HOSTED_ON_BIGCAPITAL_CLOUD=false

      # ── API rate limiting ──────────────────────────────────
      # Format: points,duration_seconds,block_duration_seconds
      - API_RATE_LIMIT=${API_RATE_LIMIT:-120,60,600}

  # ── Database migration ─────────────────────────────────────
  # Runs all Z&B migrations. Exits automatically when done.
  #
  # IMPORTANT: uses build: (same Dockerfile as server) so Docker builds it
  # from local source instead of trying to pull 'zb-bigcapital-server' from
  # Docker Hub (which would fail). Docker layer-caches the build, so this
  # shares compiled output with the server service and adds no extra compile time.
  database_migration:
    container_name: zb-database-migration
    build:
      context: ./
      dockerfile: packages/server/Dockerfile
    command: >
      sh -c "
        node packages/server/dist/cli.js system:migrate:latest &&
        node packages/server/dist/cli.js tenants:migrate:latest
      "
    environment:
      - DB_HOST=mysql
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_CHARSET=${DB_CHARSET:-utf8mb4}
      - SYSTEM_DB_NAME=${SYSTEM_DB_NAME}
      - TENANT_DB_NAME_PERFIX=${TENANT_DB_NAME_PERFIX}
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - zb_network

  # ── MariaDB database ───────────────────────────────────────
  # Stores all accounting data. Data persists in the zb_mysql volume.
  # IMPORTANT: Back this up regularly — it contains all your financial records.
  mysql:
    container_name: zb-mysql
    build:
      context: ./docker/mariadb
    environment:
      - MYSQL_DATABASE=${SYSTEM_DB_NAME}
      - MYSQL_USER=${DB_USER}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    volumes:
      - zb_mysql:/var/lib/mysql
    expose:
      - '3306'
    restart: unless-stopped
    networks:
      - zb_network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${DB_ROOT_PASSWORD}']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ──────────────────────────────────────────────────
  # Cache and background job queue (email, PDF generation, imports).
  redis:
    container_name: zb-redis
    build:
      context: ./docker/redis
    expose:
      - '6379'
    volumes:
      - zb_redis:/data
    restart: unless-stopped
    networks:
      - zb_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Gotenberg ─────────────────────────────────────────────
  # PDF generation service (invoices, reports, statements).
  gotenberg:
    container_name: zb-gotenberg
    image: gotenberg/gotenberg:7
    expose:
      - '3000'
    restart: unless-stopped
    networks:
      - zb_network

  # ── MinIO (local file storage) ────────────────────────────
  # Stores receipt photos and document attachments.
  # Replaces AWS S3 — runs entirely on your homelab.
  # Admin console: http://<your-server-ip>:9001
  minio:
    container_name: zb-minio
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - zb_minio:/data
    ports:
      # MinIO web console — accessible from your local network so you can browse
      # stored receipts and attachments from your laptop.
      # IMPORTANT: Never expose port 9001 to the public internet.
      # Your Proxmox host and UniFi firewall are the boundary here.
      - '9001:9001'
    expose:
      - '9000'
    restart: unless-stopped
    networks:
      - zb_network
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── MinIO bucket setup ─────────────────────────────────────
  # Runs once to create the attachments bucket in MinIO.
  # Exits automatically when done.
  minio_setup:
    container_name: zb-minio-setup
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - zb_network
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-zb-attachments}
    entrypoint: >
      /bin/sh -c "
      mc alias set zb http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing zb/$$MINIO_BUCKET &&
      mc anonymous set none zb/$$MINIO_BUCKET &&
      echo 'MinIO bucket ready: '$$MINIO_BUCKET
      "
    restart: 'no'

# ── Volumes ────────────────────────────────────────────────
# Docker-managed named volumes. Data persists across restarts.
# To find where Docker stores these on disk: docker volume inspect <name>
volumes:
  zb_mysql:
    name: zb_mysql
    driver: local

  zb_redis:
    name: zb_redis
    driver: local

  zb_minio:
    name: zb_minio
    driver: local

# ── Networks ───────────────────────────────────────────────
# All services communicate on this internal network.
# Only Nginx is exposed to the outside world.
networks:
  zb_network:
    driver: bridge
    name: zb_network
